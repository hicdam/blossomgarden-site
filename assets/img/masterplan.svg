<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-label="Illustrated garden masterplan showing terrace, lawn, deep planting borders, pond, blossom trees and pergola">
  <defs>
    <style>
      .lbl { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #4A473F; }
      .lbl-sm { font-family: Georgia, serif; font-style: italic; font-size: 12px; fill: #5C594F; }
      .tb { font-family: Georgia, serif; font-size: 12px; fill: #2B2A26; letter-spacing: .18em; }
      .leader { stroke: #8B867A; stroke-width: .8; fill: none; }
    </style>
    <g id="shrub-l">
      <circle r="13" fill="#93A186"/>
      <path d="M-9,-4 C-4,-10 4,-10 9,-4 M-10,3 C-4,8 4,8 10,3" stroke="#6F7D62" stroke-width="1" fill="none"/>
    </g>
    <g id="shrub-d">
      <circle r="9" fill="#6F7D62"/>
      <path d="M-6,-2 C-2,-6 2,-6 6,-2" stroke="#54614A" stroke-width="1" fill="none"/>
    </g>
    <g id="shrub-o">
      <circle r="11" fill="none" stroke="#6F7D62" stroke-width="1.1"/>
      <circle r="4.5" fill="none" stroke="#6F7D62" stroke-width=".8"/>
    </g>
    <g id="bloom-dot"><circle r="3.4" fill="#D6A0A4"/><circle r="1.2" fill="#B0767D"/></g>
    <g id="tree-plan">
      <circle r="34" fill="#B9C2A8" fill-opacity=".55" stroke="#6F7D62" stroke-width="1.2"/>
      <g stroke="#6F7D62" stroke-width=".9">
        <line x1="0" y1="0" x2="0" y2="-30"/><line x1="0" y1="0" x2="21" y2="-21"/>
        <line x1="0" y1="0" x2="30" y2="0"/><line x1="0" y1="0" x2="21" y2="21"/>
        <line x1="0" y1="0" x2="0" y2="30"/><line x1="0" y1="0" x2="-21" y2="21"/>
        <line x1="0" y1="0" x2="-30" y2="0"/><line x1="0" y1="0" x2="-21" y2="-21"/>
      </g>
      <circle r="3" fill="#3A2E29"/>
    </g>
  </defs>

  <!-- drawing sheet -->
  <rect x="14" y="14" width="732" height="542" fill="#FDFBF7" stroke="#2B2A26" stroke-width="1.4"/>
  <rect x="22" y="22" width="716" height="526" fill="none" stroke="rgba(34,56,43,.28)" stroke-width=".7"/>

  <!-- plot boundary (fence) -->
  <rect x="56" y="46" width="586" height="424" fill="#F1EADB" stroke="#3A2E29" stroke-width="1.6" stroke-dasharray="9 4"/>

  <!-- lawn -->
  <path d="M150,210 C190,150 300,132 380,150 C450,166 480,220 468,282 C456,346 380,382 290,376 C200,370 118,318 128,262 C133,232 138,228 150,210 Z"
        fill="#AEBB9E"/>
  <path d="M170,222 C205,172 300,152 368,168" fill="none" stroke="#9BAA89" stroke-width="1.2"/>
  <path d="M162,270 C220,330 330,362 430,322" fill="none" stroke="#9BAA89" stroke-width="1.2"/>

  <!-- terrace by the house -->
  <g>
    <rect x="238" y="380" width="286" height="90" fill="#E7DCC4" stroke="#8B867A" stroke-width="1"/>
    <g stroke="#CDБF9F" stroke-width="0"></g>
    <g stroke="#C9BB9C" stroke-width=".8">
      <line x1="238" y1="402" x2="524" y2="402"/><line x1="238" y1="424" x2="524" y2="424"/><line x1="238" y1="446" x2="524" y2="446"/>
      <line x1="288" y1="380" x2="288" y2="402"/><line x1="336" y1="402" x2="336" y2="424"/><line x1="384" y1="380" x2="384" y2="402"/>
      <line x1="432" y1="402" x2="432" y2="424"/><line x1="470" y1="424" x2="470" y2="446"/><line x1="312" y1="424" x2="312" y2="446"/>
      <line x1="360" y1="446" x2="360" y2="470"/><line x1="418" y1="446" x2="418" y2="470"/><line x1="264" y1="446" x2="264" y2="470"/>
    </g>
  </g>

  <!-- house -->
  <rect x="238" y="470" width="286" height="52" fill="#DDD3BE" stroke="#2B2A26" stroke-width="1.4"/>
  <path d="M300,470 A26,26 0 0 1 326,444" fill="none" stroke="#8B867A" stroke-width="1"/>
  <line x1="300" y1="470" x2="326" y2="470" stroke="#2B2A26" stroke-width="2.4"/>
  <path d="M470,470 A22,22 0 0 0 448,448" fill="none" stroke="#8B867A" stroke-width="1"/>
  <line x1="448" y1="470" x2="470" y2="470" stroke="#2B2A26" stroke-width="2.4"/>
  <text x="381" y="502" text-anchor="middle" class="tb">H O U S E</text>

  <!-- gravel path sweeping to pergola -->
  <path d="M508,380 C540,340 540,300 520,260 C500,222 500,180 530,150 C548,132 570,122 592,118"
        fill="none" stroke="#E4D8BC" stroke-width="26" stroke-linecap="round"/>
  <path d="M508,380 C540,340 540,300 520,260 C500,222 500,180 530,150 C548,132 570,122 592,118"
        fill="none" stroke="#B3A98C" stroke-width="27" stroke-dasharray="1 7" stroke-linecap="round" opacity=".7"/>

  <!-- stepping stones across lawn -->
  <g fill="#E0D5B9" stroke="#8B867A" stroke-width=".8">
    <ellipse cx="300" cy="356" rx="13" ry="9"/>
    <ellipse cx="268" cy="330" rx="13" ry="9"/>
    <ellipse cx="242" cy="300" rx="13" ry="9"/>
    <ellipse cx="224" cy="268" rx="13" ry="9"/>
  </g>

  <!-- pond -->
  <path d="M330,86 C360,72 404,74 424,92 C444,110 438,134 410,144 C380,155 338,150 322,130 C308,113 312,95 330,86 Z"
        fill="#AFC2BC" stroke="#7E958D" stroke-width="1.1"/>
  <path d="M344,102 C362,94 390,94 404,104 M352,122 C368,130 392,130 402,122" fill="none" stroke="#8FA69E" stroke-width=".9"/>

  <!-- pergola & dining, top right -->
  <g>
    <rect x="560" y="60" width="82" height="74" fill="#E7DCC4" stroke="#3A2E29" stroke-width="1.2"/>
    <g stroke="#3A2E29" stroke-width=".9" opacity=".7">
      <line x1="560" y1="72" x2="642" y2="72"/><line x1="560" y1="86" x2="642" y2="86"/>
      <line x1="560" y1="100" x2="642" y2="100"/><line x1="560" y1="114" x2="642" y2="114"/>
    </g>
    <circle cx="601" cy="96" r="15" fill="none" stroke="#3A2E29" stroke-width="1.1"/>
    <g fill="#3A2E29"><circle cx="601" cy="78" r="2.4"/><circle cx="619" cy="96" r="2.4"/><circle cx="601" cy="114" r="2.4"/><circle cx="583" cy="96" r="2.4"/></g>
  </g>

  <!-- planting borders: left band -->
  <path d="M56,46 L160,46 C120,120 108,220 116,320 C122,384 140,430 160,470 L56,470 Z" fill="#93A186" fill-opacity=".5"/>
  <!-- top band -->
  <path d="M160,46 L642,46 L642,58 C520,60 470,58 420,66 C360,74 280,80 220,72 C190,68 172,58 160,46 Z" fill="#93A186" fill-opacity=".5"/>
  <!-- right band -->
  <path d="M642,140 L642,470 L540,470 C560,420 570,360 560,300 C574,240 600,180 642,140 Z" fill="#93A186" fill-opacity=".45"/>

  <!-- planting symbols -->
  <use href="#shrub-l" transform="translate(92,110)"/>
  <use href="#shrub-o" transform="translate(128,150)"/>
  <use href="#shrub-d" transform="translate(90,180)"/>
  <use href="#shrub-l" transform="translate(120,240)"/>
  <use href="#shrub-o" transform="translate(92,300)"/>
  <use href="#shrub-d" transform="translate(126,352)"/>
  <use href="#shrub-l" transform="translate(100,410)"/>
  <use href="#shrub-o" transform="translate(140,440)"/>
  <use href="#shrub-d" transform="translate(200,60)"/>
  <use href="#shrub-l" transform="translate(260,66)"/>
  <use href="#shrub-o" transform="translate(320,64)"/>
  <use href="#shrub-d" transform="translate(470,60)"/>
  <use href="#shrub-l" transform="translate(520,64)"/>
  <use href="#shrub-o" transform="translate(600,150)"/>
  <use href="#shrub-d" transform="translate(618,200)"/>
  <use href="#shrub-l" transform="translate(590,250)"/>
  <use href="#shrub-o" transform="translate(612,310)"/>
  <use href="#shrub-d" transform="translate(586,360)"/>
  <use href="#shrub-l" transform="translate(600,420)"/>
  <g>
    <use href="#bloom-dot" transform="translate(108,132)"/>
    <use href="#bloom-dot" transform="translate(118,205)"/>
    <use href="#bloom-dot" transform="translate(104,268)"/>
    <use href="#bloom-dot" transform="translate(132,388)"/>
    <use href="#bloom-dot" transform="translate(232,72)"/>
    <use href="#bloom-dot" transform="translate(296,58)"/>
    <use href="#bloom-dot" transform="translate(500,70)"/>
    <use href="#bloom-dot" transform="translate(608,176)"/>
    <use href="#bloom-dot" transform="translate(598,282)"/>
    <use href="#bloom-dot" transform="translate(614,392)"/>
  </g>

  <!-- feature trees -->
  <use href="#tree-plan" transform="translate(196,120)"/>
  <use href="#tree-plan" transform="translate(498,196) scale(.82)"/>

  <!-- bench nook -->
  <g transform="translate(170,330)">
    <rect x="-16" y="-5" width="32" height="10" rx="2" fill="none" stroke="#3A2E29" stroke-width="1.2" transform="rotate(-28)"/>
  </g>

  <!-- labels with leaders -->
  <text x="60" y="510" class="lbl">deep mixed borders, year-round structure</text>
  <path class="leader" d="M118,505 C110,490 106,478 104,462"/>

  <text x="242" y="540" class="lbl">york stone terrace</text>
  <path class="leader" d="M300,532 C304,522 308,512 312,500"/>

  <text x="60" y="70" class="lbl">multi-stem amelanchier</text>
  <path class="leader" d="M166,74 C178,86 186,96 192,106"/>

  <text x="340" y="40" class="lbl">reflecting pond</text>
  <path class="leader" d="M382,46 C380,58 378,66 376,76"/>

  <text x="536" y="40" class="lbl">oak pergola, dining for eight</text>
  <path class="leader" d="M592,46 C592,50 592,54 592,58"/>

  <text x="446" y="540" class="lbl">flowering cherry, spring canopy</text>
  <path class="leader" d="M498,532 C498,520 498,300 498,232" stroke-dasharray="2 4"/>

  <text x="654" y="250" class="lbl-sm" transform="rotate(90 654 250)">gravel walk</text>

  <!-- north arrow -->
  <g transform="translate(686,80)">
    <circle r="17" fill="none" stroke="#2B2A26" stroke-width="1"/>
    <path d="M0,10 L0,-12 M0,-12 L-4,-4 M0,-12 L4,-4" stroke="#2B2A26" stroke-width="1.2" fill="none"/>
    <text x="0" y="32" text-anchor="middle" class="lbl-sm">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(56,532)" display="none">
    <rect x="0" y="0" width="30" height="5" fill="#2B2A26"/>
    <rect x="30" y="0" width="30" height="5" fill="none" stroke="#2B2A26" stroke-width=".8"/>
    <rect x="60" y="0" width="30" height="5" fill="#2B2A26"/>
  </g>

  <!-- title block -->
  <g>
    <rect x="524" y="486" width="214" height="62" fill="#FDFBF7" stroke="#2B2A26" stroke-width="1.2"/>
    <text x="538" y="508" class="tb">B L O S S O M</text>
    <text x="538" y="526" class="lbl-sm">the garden masterplan</text>
    <text x="538" y="541" class="lbl-sm">scale 1:100 · drawing 01</text>
  </g>
</svg>
